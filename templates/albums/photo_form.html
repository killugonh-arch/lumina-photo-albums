{% extends 'base.html' %}
{% block title %}Edit Photo — Lumina{% endblock %}
{% block content %}
<div class="breadcrumb">
    <a href="{% url 'albums:album_list' %}">Explore</a>
    <span class="breadcrumb-sep">›</span>
    <a href="{% url 'albums:album_detail' object.album.pk %}">{{ object.album.title }}</a>
    <span class="breadcrumb-sep">›</span>
    <span>Edit Photo</span>
</div>
<div class="page-header">
    <div>
        <p class="section-label">Photo Management</p>
        <h1 class="page-title" style="font-size:2.2rem;">Edit Photo</h1>
    </div>
</div>
<hr class="divider">
<div class="form-wrap">
    <div style="margin-bottom:2rem;">
        <img src="{{ object.image.url }}" alt="{{ object.title }}" style="max-width:300px; border:1px solid var(--border);">
    </div>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-group"><label>Title</label>{{ form.title }}</div>
        <div class="form-group"><label>Description</label>{{ form.description }}</div>
        <div class="form-group"><label>Order</label>{{ form.order }}</div>
        <hr class="divider">
        <div style="display:flex; gap:1rem;">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{% url 'albums:album_detail' object.album.pk %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
