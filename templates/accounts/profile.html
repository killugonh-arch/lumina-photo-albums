{% extends 'base.html' %}
{% block title %}My Profile — Lumina{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <p class="section-label">Account</p>
        <h1 class="page-title" style="font-size:2.2rem;">My Profile</h1>
    </div>
</div>
<hr class="divider">
<div class="form-wrap">
    <form method="post">
        {% csrf_token %}
        <div class="form-group"><label>First Name</label>{{ form.first_name }}</div>
        <div class="form-group"><label>Last Name</label>{{ form.last_name }}</div>
        <div class="form-group"><label>Email</label>{{ form.email }}</div>
        <hr class="divider">
        <button type="submit" class="btn btn-primary">Save Changes</button>
    </form>

    <hr class="divider">
    <div>
        <p class="section-label">Quick Stats</p>
        <div style="display:flex; gap:2rem; margin-top:1rem;">
            <div>
                <div style="font-family:'Cormorant Garamond',serif; font-size:2rem; font-weight:300;">{{ user.albums.count }}</div>
                <div style="font-size:0.78rem; color:var(--warm-gray); text-transform:uppercase; letter-spacing:0.1em;">Albums</div>
            </div>
            <div>
                <div style="font-family:'Cormorant Garamond',serif; font-size:2rem; font-weight:300;">{{ user.uploaded_photos.count }}</div>
                <div style="font-size:0.78rem; color:var(--warm-gray); text-transform:uppercase; letter-spacing:0.1em;">Photos</div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
